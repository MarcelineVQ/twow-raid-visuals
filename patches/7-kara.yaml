### garlmoon ##############################
# removes extra spell effects from gnarlmoon red and blue moon auras
SpellVisualKit.dbc:
  - type: update
    key: 5849 # red moon Spell 51081, SpellVisual 6539
    values:
      HeadEffect: 1544 #add an orb above you
      ChestEffect: 0
      BaseEffect: 0
      LeftHandEffect: 0
      RightHandEffect: 0
      CharProc_1: 1 #allows this to fade properly if not cleared by other effects
  - type: update
    key: 5893 #blue moon Spell 51080, SpellVisual 6589
    values:
      HeadEffect: 1544 #add an orb above you
      ChestEffect: 0
      BaseEffect: 0
      LeftHandEffect: 0
      RightHandEffect: 0
      CharProc_1: 1 #allows this to fade properly if not cleared by other effects
###########################################

